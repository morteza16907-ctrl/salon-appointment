<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سالن زیبایی - نوبت‌دهی آنلاین</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Vazirmatn', 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #faf3f0 0%, #f5e6e0 50%, #f0e4ec 100%);
            min-height: 100vh;
        }
        #app {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            position: relative;
        }
        .kimi-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid rgba(255,255,255,0.5);
        }
        .kimi-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .kimi-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .kimi-btn--primary {
            background: linear-gradient(135deg, #ffb6c1, #ffc0cb);
            color: white;
            box-shadow: 0 4px 15px rgba(255,182,193,0.4);
        }
        .kimi-btn--primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255,182,193,0.5); }
        .kimi-btn--secondary {
            background: linear-gradient(135deg, #b8c5d6, #c5d1e0);
            color: white;
            box-shadow: 0 4px 15px rgba(184,197,214,0.4);
        }
        .kimi-btn--danger {
            background: linear-gradient(135deg, #e8a0a0, #f0b0b0);
            color: white;
        }
        .kimi-btn--success {
            background: linear-gradient(135deg, #a8d5ba, #b8e0c8);
            color: #2d5a3d;
        }
        .kimi-btn--bale {
            background: linear-gradient(135deg, #7c4dff, #b388ff);
            color: white;
            box-shadow: 0 4px 15px rgba(124,77,255,0.4);
        }
        .kimi-input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255,182,193,0.3);
            border-radius: 14px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            background: rgba(255,255,255,0.8);
            transition: all 0.3s;
            outline: none;
        }
        .kimi-input:focus { border-color: #ffb6c1; box-shadow: 0 0 0 3px rgba(255,182,193,0.2); }
        .kimi-select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid rgba(255,182,193,0.3);
            border-radius: 14px;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 14px;
            background: rgba(255,255,255,0.8);
            cursor: pointer;
            outline: none;
        }
        .kimi-notification {
            padding: 14px 20px;
            border-radius: 14px;
            margin-bottom: 8px;
            font-size: 13px;
            animation: slideDown 0.3s ease;
            backdrop-filter: blur(10px);
        }
        .kimi-notification--info { background: rgba(184,197,214,0.9); color: #4a5568; }
        .kimi-notification--success { background: rgba(168,213,186,0.9); color: #2d5a3d; }
        .kimi-notification--error { background: rgba(232,160,160,0.9); color: #8b3a3a; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .slot-btn {
            padding: 10px 16px;
            border: 2px solid rgba(255,182,193,0.4);
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 13px;
            transition: all 0.3s;
            color: #666;
        }
        .slot-btn:hover { border-color: #ffb6c1; background: rgba(255,182,193,0.1); }
        .slot-btn.selected { background: linear-gradient(135deg, #ffb6c1, #ffc0cb); color: white; border-color: #ffb6c1; }
        .slot-btn.disabled { opacity: 0.4; cursor: not-allowed; background: #f0f0f0; }
        .service-card {
            padding: 16px;
            border-radius: 16px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.7);
        }
        .service-card:hover { border-color: rgba(255,182,193,0.5); }
        .service-card.selected { border-color: #ffb6c1; background: rgba(255,182,193,0.1); }
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-pending { background: #fff3cd; color: #856404; }
        .status-confirmed { background: #d4edda; color: #155724; }
        .status-cancelled { background: #f8d7da; color: #721c24; }
        .status-waiting { background: #e2e3f3; color: #383d7a; }
        .tab-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Vazirmatn', sans-serif;
            font-size: 12px;
            background: rgba(255,255,255,0.5);
            color: #888;
            transition: all 0.3s;
        }
        .tab-btn.active { background: linear-gradient(135deg, #b8c5d6, #c5d1e0); color: white; }
        .calendar-day {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
            border: 2px solid transparent;
        }
        .calendar-day:hover { background: rgba(255,182,193,0.2); }
        .calendar-day.selected { background: linear-gradient(135deg, #ffb6c1, #ffc0cb); color: white; }
        .calendar-day.off { opacity: 0.3; cursor: not-allowed; text-decoration: line-through; }
        .calendar-day.today { border-color: #ffb6c1; font-weight: 700; }
        .calendar-day.has-apt { position: relative; }
        .calendar-day.has-apt::after {
            content: '';
            position: absolute;
            bottom: 4px;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #ffb6c1;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        const state = {
            currentView: 'customer',
            adminLoggedIn: false,
            adminPassword: 'admin123',
            workHours: { start: '09:00', end: '21:00' },
            bufferMinutes: 15,
            offDays: [],
            prices: { 'اصلاح': 150000, 'لیفت ابرو': 300000 },
            services: [
                { id: 'haircut', name: 'اصلاح', duration: 30, price: 150000 },
                { id: 'eyebrow', name: 'لیفت ابرو', duration: 90, price: 300000 }
            ],
            appointments: [],
            waitlist: [],
            selectedDate: new Date().toISOString().split('T')[0],
            notifications: [],
            // Payment Settings - Editable by Admin
            paymentSettings: {
                cardNumber: '۶۲۱۹ - ۸۶۱۰ - ۰۰۰۰ - ۰۰۰۰',
                cardHolder: 'سارا احمدی',
                bankName: 'بانک ملت',
                telegramLink: '',
                baleLink: ''
            }
        };

        function loadData() {
            const saved = localStorage.getItem('salonAppData');
            if (saved) {
                const data = JSON.parse(saved);
                Object.assign(state, data);
                if (!state.services) {
                    state.services = [
                        { id: 'haircut', name: 'اصلاح', duration: 30, price: 150000 },
                        { id: 'eyebrow', name: 'لیفت ابرو', duration: 90, price: 300000 }
                    ];
                }
                if (!state.paymentSettings) {
                    state.paymentSettings = {
                        cardNumber: '۶۲۱۹ - ۸۶۱۰ - ۰۰۰۰ - ۰۰۰۰',
                        cardHolder: 'سارا احمدی',
                        bankName: 'بانک ملت',
                        telegramLink: '',
                        baleLink: ''
                    };
                }
            }
        }

        function saveData() {
            localStorage.setItem('salonAppData', JSON.stringify({
                workHours: state.workHours,
                bufferMinutes: state.bufferMinutes,
                offDays: state.offDays,
                prices: state.prices,
                services: state.services,
                appointments: state.appointments,
                waitlist: state.waitlist,
                notifications: state.notifications,
                paymentSettings: state.paymentSettings
            }));
        }

        function formatPrice(price) {
            return price.toLocaleString('fa-IR') + ' تومان';
        }

        function formatTime(timeStr) {
            const [h, m] = timeStr.split(':');
            return h.padStart(2, '0') + ':' + m.padStart(2, '0');
        }

        function addMinutes(timeStr, minutes) {
            const [h, m] = timeStr.split(':').map(Number);
            const total = h * 60 + m + minutes;
            const newH = Math.floor(total / 60);
            const newM = total % 60;
            return String(newH).padStart(2, '0') + ':' + String(newM).padStart(2, '0');
        }

        function timeToMinutes(timeStr) {
            const [h, m] = timeStr.split(':').map(Number);
            return h * 60 + m;
        }

        function isSlotAvailable(date, time, duration) {
            const endTime = addMinutes(time, duration + state.bufferMinutes);
            if (time < state.workHours.start || endTime > state.workHours.end) return false;
            if (state.offDays.includes(date)) return false;
            for (const apt of state.appointments) {
                if (apt.date !== date) continue;
                if (apt.status === 'cancelled') continue;
                const aptStart = timeToMinutes(apt.time);
                const aptEnd = timeToMinutes(addMinutes(apt.time, apt.duration + state.bufferMinutes));
                const newStart = timeToMinutes(time);
                const newEnd = timeToMinutes(endTime);
                if (newStart < aptEnd && newEnd > aptStart) return false;
            }
            return true;
        }

        function getAvailableSlots(date, serviceDuration) {
            const slots = [];
            let current = state.workHours.start;
            while (addMinutes(current, serviceDuration) <= state.workHours.end) {
                if (isSlotAvailable(date, current, serviceDuration)) slots.push(current);
                current = addMinutes(current, 30);
            }
            return slots;
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2);
        }

        function getToday() {
            return new Date().toISOString().split('T')[0];
        }

        function daysUntil(dateStr) {
            const d1 = new Date(getToday());
            const d2 = new Date(dateStr);
            return Math.floor((d2 - d1) / (1000 * 60 * 60 * 24));
        }

        // ---- Jalali (Shamsi) calendar helpers — pure JS, no external library/CDN ----
        function faDigits(n) {
            return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
        }

        function gregorianToJalali(gy, gm, gd) {
            const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
            let jy;
            gy = parseInt(gy); gm = parseInt(gm); gd = parseInt(gd);
            if (gy <= 1600) { jy = 0; gy -= 621; } else { jy = 979; gy -= 1600; }
            const gy2 = (gm > 2) ? (gy + 1) : gy;
            let days = (365 * gy) + parseInt((gy2 + 3) / 4) - parseInt((gy2 + 99) / 100) + parseInt((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
            jy += 33 * parseInt(days / 12053);
            days %= 12053;
            jy += 4 * parseInt(days / 1461);
            days %= 1461;
            if (days > 365) {
                jy += parseInt((days - 1) / 365);
                days = (days - 1) % 365;
            }
            const jm = (days < 186) ? 1 + parseInt(days / 31) : 7 + parseInt((days - 186) / 30);
            const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
            return [jy, jm, jd];
        }

        function jalaliToGregorian(jy, jm, jd) {
            let gy;
            jy = parseInt(jy); jm = parseInt(jm); jd = parseInt(jd);
            if (jy <= 979) { gy = 621; } else { gy = 1600; jy -= 979; }
            let days = (365 * jy) + (parseInt(jy / 33) * 8) + parseInt(((jy % 33) + 3) / 4) + 78 + jd + ((jm < 7) ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
            gy += 400 * parseInt(days / 146097);
            days %= 146097;
            if (days > 36524) {
                gy += 100 * parseInt(--days / 36524);
                days %= 36524;
                if (days >= 365) days++;
            }
            gy += 4 * parseInt(days / 1461);
            days %= 1461;
            if (days > 365) {
                gy += parseInt((days - 1) / 365);
                days = (days - 1) % 365;
            }
            let gd = days + 1;
            const isLeapG = (gy % 4 === 0 && gy % 100 !== 0) || (gy % 400 === 0);
            const sal_a = [0, 31, isLeapG ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            let gm;
            for (gm = 1; gm <= 12; gm++) {
                const v = sal_a[gm];
                if (gd <= v) break;
                gd -= v;
            }
            return [gy, gm, gd];
        }

        function jalaliMonthLength(jy, jm) {
            const g1 = jalaliToGregorian(jy, jm, 1);
            const jy2 = jm === 12 ? jy + 1 : jy;
            const jm2 = jm === 12 ? 1 : jm + 1;
            const g2 = jalaliToGregorian(jy2, jm2, 1);
            const d1 = new Date(g1[0], g1[1] - 1, g1[2]);
            const d2 = new Date(g2[0], g2[1] - 1, g2[2]);
            return Math.round((d2 - d1) / 86400000);
        }

        let calendarMonthOffset = 0;
        function changeCalendarMonth(delta) {
            calendarMonthOffset += delta;
            if (calendarMonthOffset < 0) calendarMonthOffset = 0;
            renderApp();
        }

        function showNotification(message, type = 'info') {
            const notif = { id: generateId(), message, type, time: Date.now() };
            state.notifications.push(notif);
            renderNotifications();
            setTimeout(() => {
                state.notifications = state.notifications.filter(n => n.id !== notif.id);
                renderNotifications();
            }, 4000);
        }

        function renderNotifications() {
            const container = document.getElementById('notifications');
            if (!container) return;
            container.innerHTML = state.notifications.map(n => 
                `<div class="kimi-notification kimi-notification--${n.type}">${n.message}</div>`
            ).join('');
        }

        let customerStep = 1;
        let selectedService = null;
        let selectedDate = getToday();
        let selectedTime = null;
        let customerName = '';
        let customerPhone = '';

        function renderApp() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div style="padding: 20px; text-align: center; background: rgba(255,255,255,0.7); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,182,193,0.3);">
                    <h1 style="margin: 0; font-size: 24px; color: #c4717a; font-weight: 700;">✨ سالن زیبایی</h1>
                    <p style="margin: 5px 0 0; color: #a08088; font-size: 13px;">نوبت‌دهی آنلاین</p>
                </div>
                <div id="notifications" style="position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 1000; width: 90%; max-width: 400px;"></div>
                <nav style="display: flex; padding: 10px 20px; gap: 10px; background: rgba(255,255,255,0.5);">
                    <button onclick="switchView('customer')" style="flex: 1; padding: 10px; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: 14px; transition: all 0.3s; background: ${state.currentView === 'customer' ? 'linear-gradient(135deg, #ffb6c1, #ffc0cb)' : 'rgba(255,255,255,0.6)'}; color: ${state.currentView === 'customer' ? '#fff' : '#888'}; box-shadow: ${state.currentView === 'customer' ? '0 4px 15px rgba(255,182,193,0.4)' : 'none'};">
                        🗓️ رزرو نوبت
                    </button>
                    <button onclick="switchView('admin')" style="flex: 1; padding: 10px; border: none; border-radius: 12px; cursor: pointer; font-family: inherit; font-size: 14px; transition: all 0.3s; background: ${state.currentView === 'admin' ? 'linear-gradient(135deg, #b8c5d6, #c5d1e0)' : 'rgba(255,255,255,0.6)'}; color: ${state.currentView === 'admin' ? '#fff' : '#888'}; box-shadow: ${state.currentView === 'admin' ? '0 4px 15px rgba(184,197,214,0.4)' : 'none'};">
                        ⚙️ پنل ادمین
                    </button>
                </nav>
                <main style="padding: 20px; padding-bottom: 100px;">
                    ${state.currentView === 'customer' ? renderCustomerView() : renderAdminView()}
                </main>
            `;
        }

        function renderCustomerView() {
            if (customerStep === 1) return renderServiceSelection();
            if (customerStep === 2) return renderDateTimeSelection();
            if (customerStep === 3) return renderCustomerInfo();
            if (customerStep === 4) return renderPaymentStep();
            if (customerStep === 5) return renderConfirmation();
            return '';
        }

        function renderServiceSelection() {
            return `
                <div class="kimi-card">
                    <h3 style="margin: 0 0 20px; color: #c4717a; font-size: 18px;">💇‍♀️ انتخاب خدمت</h3>
                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        ${state.services.map(s => `
                            <div class="service-card ${selectedService?.id === s.id ? 'selected' : ''}" onclick="selectService('${s.id}')">
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div>
                                        <div style="font-weight: 600; color: #444; font-size: 15px;">${s.name}</div>
                                        <div style="font-size: 12px; color: #999; margin-top: 4px;">⏱️ ${s.duration} دقیقه</div>
                                    </div>
                                    <div style="font-weight: 700; color: #c4717a; font-size: 16px;">${formatPrice(s.price)}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    <button class="kimi-btn kimi-btn--primary" style="width: 100%; margin-top: 20px;" onclick="goToStep(2)" ${!selectedService ? 'disabled' : ''}>
                        ادامه →
                    </button>
                </div>
                ${renderMyAppointments()}
            `;
        }

        function renderDateTimeSelection() {
            const slots = getAvailableSlots(selectedDate, selectedService.duration);
            const monthNames = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];

            const now = new Date();
            const [todayJy, todayJm] = gregorianToJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());
            let jy = todayJy, jm = todayJm + calendarMonthOffset;
            while (jm > 12) { jm -= 12; jy += 1; }
            while (jm < 1) { jm += 12; jy -= 1; }

            const monthName = monthNames[jm - 1];
            const daysInMonth = jalaliMonthLength(jy, jm);
            const [fg_y, fg_m, fg_d] = jalaliToGregorian(jy, jm, 1);
            const firstDay = (new Date(fg_y, fg_m - 1, fg_d).getDay() + 1) % 7; // realign to Sat-first Persian week

            let calendarHtml = '<div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; margin-bottom: 8px;">';
            ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'].forEach(dn => calendarHtml += `<div style="font-size: 11px; color: #999; padding: 4px;">${dn}</div>`);
            calendarHtml += '</div>';

            calendarHtml += '<div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center;">';
            for (let i = 0; i < firstDay; i++) calendarHtml += '<div></div>';

            for (let day = 1; day <= daysInMonth; day++) {
                const [gy, gm, gd] = jalaliToGregorian(jy, jm, day);
                const dateStr = `${gy}-${String(gm).padStart(2, '0')}-${String(gd).padStart(2, '0')}`;
                const isOff = state.offDays.includes(dateStr);
                const isToday = dateStr === getToday();
                const isSelected = dateStr === selectedDate;
                const hasApt = state.appointments.some(a => a.date === dateStr && a.status !== 'cancelled');
                const isPast = new Date(dateStr) < new Date(getToday());

                calendarHtml += `<div class="calendar-day ${isSelected ? 'selected' : ''} ${isOff || isPast ? 'off' : ''} ${isToday ? 'today' : ''} ${hasApt ? 'has-apt' : ''}" 
                    onclick="${isOff || isPast ? '' : `selectDate('${dateStr}')`}">${faDigits(day)}</div>`;
            }
            calendarHtml += '</div>';

            return `
                <div class="kimi-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <button class="kimi-btn" style="padding: 6px 12px; font-size: 12px; background: rgba(255,255,255,0.6);" onclick="goToStep(1)">← برگشت</button>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <button class="kimi-btn" style="padding: 4px 10px; font-size: 12px; background: rgba(255,255,255,0.6);" ${calendarMonthOffset === 0 ? 'disabled' : ''} onclick="changeCalendarMonth(-1)">›</button>
                            <h3 style="margin: 0; color: #c4717a; font-size: 16px; white-space: nowrap;">📅 ${monthName} ${faDigits(jy)}</h3>
                            <button class="kimi-btn" style="padding: 4px 10px; font-size: 12px; background: rgba(255,255,255,0.6);" onclick="changeCalendarMonth(1)">‹</button>
                        </div>
                    </div>
                    ${calendarHtml}
                    <div style="margin-top: 20px;">
                        <h4 style="color: #888; font-size: 13px; margin-bottom: 10px;">⏰ ساعت‌های خالی ${selectedDate === getToday() ? '(امروز)' : ''}</h4>
                        ${slots.length > 0 ? `
                            <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                                ${slots.map(t => `
                                    <button class="slot-btn ${selectedTime === t ? 'selected' : ''}" onclick="selectTime('${t}')">${t}</button>
                                `).join('')}
                            </div>
                        ` : '<p style="color: #999; font-size: 13px;">متأسفانه این روز نوبت خالی نداریم 😔</p>'}
                        ${slots.length === 0 ? `
                            <button class="kimi-btn kimi-btn--secondary" style="width: 100%; margin-top: 15px;" onclick="joinWaitlist()">
                                🔔 برو تو لیست انتظار
                            </button>
                        ` : ''}
                    </div>
                    <button class="kimi-btn kimi-btn--primary" style="width: 100%; margin-top: 20px;" onclick="goToStep(3)" ${!selectedTime ? 'disabled' : ''}>
                        ادامه →
                    </button>
                </div>
            `;
        }

        function renderCustomerInfo() {
            return `
                <div class="kimi-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">

        function renderAdminReports() {
            const totalApts = state.appointments.filter(a => a.status !== 'cancelled').length;
            const confirmedApts = state.appointments.filter(a => a.status === 'confirmed').length;
            const totalRevenue = state.appointments.filter(a => a.status === 'confirmed').reduce((sum, a) => sum + (a.price || 0), 0);

            const serviceCounts = {};
            state.appointments.filter(a => a.status === 'confirmed').forEach(a => {
                serviceCounts[a.service] = (serviceCounts[a.service] || 0) + 1;
            });

            const todayApts = state.appointments.filter(a => a.date === getToday() && a.status !== 'cancelled');

            const customers = {};
            state.appointments.forEach(a => {
                if (!customers[a.phone]) customers[a.phone] = { name: a.name, phone: a.phone, count: 0, lastDate: a.date };
                customers[a.phone].count++;
                if (a.date > customers[a.phone].lastDate) customers[a.phone].lastDate = a.date;
            });
            const sortedCustomers = Object.values(customers).sort((a, b) => b.count - a.count);

            return `
                <div>
                    <div class="kimi-card">
                        <h3 style="margin: 0 0 15px; color: #c4717a; font-size: 16px;">📊 آمار کلی</h3>
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">

                                <div style="font-size: 12px; color: #888;">تأیید شده</div>
                            </div>
                            <div style="background: linear-gradient(135deg, rgba(184,197,214,0.2), rgba(200,210,225,0.1)); padding: 15px; border-radius: 14px; text-align: center;">
                                <div style="font-size: 24px; font-weight: 700; color: #4a5568;">${formatPrice(totalRevenue)}</div>
                                <div style="font-size: 12px; color: #888;">درآمد کل</div>
                            </div>
                            <div style="background: linear-gradient(135deg, rgba(255,243,205,0.3), rgba(255,248,220,0.1)); padding: 15px; border-radius: 14px; text-align: center;">
                                <div style="font-size: 24px; font-weight: 700; color: #856404;">${todayApts.length}</div>
                                <div style="font-size: 12px; color: #888;">نوبت امروز</div>
                            </div>
                        </div>
                    </div>

                    <div class="kimi-card">
                        <h3 style="margin: 0 0 15px; color: #c4717a; font-size: 16px;">📈 محبوب‌ترین خدمات</h3>
                        ${Object.entries(serviceCounts).length === 0 ? '<p style="color: #999; text-align: center;">داده‌ای موجود نیست</p>' : ''}
                        ${Object.entries(serviceCounts).sort((a, b) => b[1] - a[1]).map(([service, count]) => `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05);">
                                <span style="color: #444;">${service}</span>
                                <div style="display: flex; align-items: center; gap: 8px;">
                                    <div style="background: rgba(255,182,193,0.3); height: 8px; border-radius: 4px; width: ${Math.min(count * 20, 100)}px;"></div>
                                    <span style="font-weight: 600; color: #c4717a; font-size: 14px;">${count} نوبت</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="kimi-card">
                        <h3 style="margin: 0 0 15px; color: #c4717a; font-size: 16px;">👤 تاریخچه مشتریان</h3>
                        ${sortedCustomers.length === 0 ? '<p style="color: #999; text-align: center;">مشتری ثبت نشده</p>' : ''}
                        ${sortedCustomers.map(c => `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05);">
                                <div>
                                    <div style="font-weight: 600; color: #444; font-size: 14px;">${c.name}</div>
                                    <div style="font-size: 11px; color: #999;">${c.phone}</div>
                                </div>
                                <div style="text-align: left;">
                                    <div style="font-weight: 600; color: #c4717a; font-size: 14px;">${c.count} نوبت</div>
                                    <div style="font-size: 11px; color: #999;">آخرین: ${c.lastDate}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAdminWaitlist() {
            return `
                <div class="kimi-card">
                    <h3 style="margin: 0 0 15px; color: #c4717a; font-size: 16px;">🔔 لیست انتظار (${state.waitlist.length})</h3>
                    ${state.waitlist.length === 0 ? '<p style="color: #999; text-align: center;">کسی در لیست انتظار نیست</p>' : ''}
                    ${state.waitlist.map((w, i) => `
                        <div style="background: rgba(255,255,255,0.5); padding: 12px; border-radius: 12px; margin-bottom: 10px;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <div>
                                    <div style="font-weight: 600; color: #444;">${w.name}</div>
                                    <div style="font-size: 12px; color: #888;">📞 ${w.phone}</div>
                                    <div style="font-size: 12px; color: #666; margin-top: 4px;">${w.service} | ${w.date}</div>
                                </div>
                                <span style="background: #e2e3f3; color: #383d7a; padding: 4px 10px; border-radius: 20px; font-size: 11px;">#${i + 1}</span>
                            </div>
                            <button class="kimi-btn kimi-btn--success" style="width: 100%; margin-top: 10px; padding: 8px; font-size: 12px;" onclick="contactWaitlist('${w.phone}')">📱 تماس با مشتری</button>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function switchView(view) {
            state.currentView = view;
            renderApp();
        }

        function goToStep(step) {
            customerStep = step;
            renderApp();
        }

        function selectService(id) {
            selectedService = state.services.find(s => s.id === id);
            renderApp();
        }

        function selectDate(date) {
            selectedDate = date;
            selectedTime = null;
            renderApp();
        }

        function selectTime(time) {
            selectedTime = time;
            renderApp();
        }

        function submitCustomerInfo() {
            customerName = document.getElementById('custName').value.trim();
            customerPhone = document.getElementById('custPhone').value.trim();

            if (!customerName || !customerPhone) {
                showNotification('لطفاً همه فیلدها رو پر کنید', 'error');
                return;
            }
            if (!/^09\d{9}$/.test(customerPhone)) {
                showNotification('شماره موبایل نامعتبر است', 'error');
                return;
            }
            goToStep(4);
        }

        function submitPayment(method) {
            const appointment = {
                id: generateId(),
                name: customerName,
                phone: customerPhone,
                service: selectedService.name,
                serviceId: selectedService.id,
                date: selectedDate,
                time: selectedTime,
                duration: selectedService.duration,
                price: selectedService.price,
                status: 'pending',
                paymentMethod: method,
                createdAt: new Date().toISOString()
            };

            state.appointments.push(appointment);
            saveData();

            if (method === 'telegram' && state.paymentSettings.telegramLink) {
                const message = `سلام، من ${customerName} هستم. فیش واریزی برای نوبت ${selectedService.name} در تاریخ ${selectedDate} ساعت ${selectedTime} رو ارسال می‌کنم.`;
                window.open(`https://t.me/share/url?url=&text=${encodeURIComponent(message)}`, '_blank');
            }

            if (method === 'bale' && state.paymentSettings.baleLink) {
                const message = `سلام، من ${customerName} هستم. فیش واریزی برای نوبت ${selectedService.name} در تاریخ ${selectedDate} ساعت ${selectedTime} رو ارسال می‌کنم.`;
                window.open(`${state.paymentSettings.baleLink}?text=${encodeURIComponent(message)}`, '_blank');
            }

            goToStep(5);
            showNotification('نوبت شما ثبت شد! منتظر تأیید ادمین هستید', 'success');
        }

        function resetBooking() {
            customerStep = 1;
            selectedService = null;
            selectedDate = getToday();
            selectedTime = null;
            renderApp();
        }

        function cancelAppointment(id) {
            const apt = state.appointments.find(a => a.id === id);
            if (!apt) return;
            if (daysUntil(apt.date) < 1) {
                showNotification('امکان لغو کمتر از ۲۴ ساعت قبل نوبت وجود ندارد', 'error');
                return;
            }
            apt.status = 'cancelled';
            saveData();
            notifyWaitlist(apt.date, apt.time, apt.duration);
            showNotification('نوبت شما لغو شد', 'info');
            renderApp();
        }

        function joinWaitlist() {
            if (!selectedService) return;
            const name = prompt('نام و نام خانوادگی:');
            const phone = prompt('شماره موبایل:');
            if (!name || !phone) {
                showNotification('لطفاً اطلاعات را کامل وارد کنید', 'error');
                return;
            }
            state.waitlist.push({
                id: generateId(),
                name,
                phone,
                service: selectedService.name,
                serviceId: selectedService.id,
                date: selectedDate,
                createdAt: new Date().toISOString()
            });
            saveData();
            showNotification('شما به لیست انتظار اضافه شدید', 'success');
            renderApp();
        }

        function notifyWaitlist(date, time, duration) {
            const available = getAvailableSlots(date, duration);
            if (available.length > 0) {
                showNotification('🔔 مشتریان لیست انتظار مطلع شدند', 'info');
            }
        }

        function adminLogin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === state.adminPassword) {
                state.adminLoggedIn = true;
                showNotification('خوش آمدید ادمین عزیز', 'success');
                renderApp();
            } else {
                showNotification('رمز عبور اشتباه است', 'error');
            }
        }

        function adminLogout() {
            state.adminLoggedIn = false;
            renderApp();
        }

        function setAdminTab(tab) {
            adminTab = tab;
            renderApp();
        }

        function confirmAppointment(id) {
            const apt = state.appointments.find(a => a.id === id);
            if (apt) {
                apt.status = 'confirmed';
                saveData();
                showNotification('نوبت تأیید شد', 'success');
                renderApp();
            }
        }

        function adminCancelAppointment(id) {
            const apt = state.appointments.find(a => a.id === id);
            if (apt) {
                apt.status = 'cancelled';
                saveData();
                notifyWaitlist(apt.date, apt.time, apt.duration);
                showNotification('نوبت لغو شد', 'info');
                renderApp();
            }
        }

        function saveWorkHours() {
            state.workHours.start = document.getElementById('workStart').value;
            state.workHours.end = document.getElementById('workEnd').value;
            saveData();
            showNotification('ساعت کاری ذخیره شد', 'success');
        }

        function saveBuffer() {
            state.bufferMinutes = parseInt(document.getElementById('bufferSlider').value);
            saveData();
            showNotification('بافر زمانی ذخیره شد', 'success');
        }

        function addOffDay() {
            const date = document.getElementById('offDayDate').value;
            if (!date) return;
            if (!state.offDays.includes(date)) {
                state.offDays.push(date);
                state.offDays.sort();
                saveData();
                showNotification('روز تعطیل اضافه شد', 'success');
                renderApp();
            }
        }

        function removeOffDay(date) {
            state.offDays = state.offDays.filter(d => d !== date);
            saveData();
            showNotification('روز تعطیل حذف شد', 'info');
            renderApp();
        }

        function savePrices() {
            state.services.forEach(s => {
                const input = document.getElementById(`price-${s.id}`);
                if (input) {
                    s.price = parseInt(input.value) || s.price;
                    state.prices[s.name] = s.price;
                }
            });
            saveData();
            showNotification('قیمت‌ها ذخیره شد', 'success');
        }

        function saveSmsSettings() {
            showNotification('تنظیمات SMS ذخیره شد (آماده اتصال به API)', 'success');
        }

        function savePaymentSettings() {
            state.paymentSettings.cardNumber = document.getElementById('cardNumber').value;
            state.paymentSettings.cardHolder = document.getElementById('cardHolder').value;
            state.paymentSettings.bankName = document.getElementById('bankName').value;
            state.paymentSettings.telegramLink = document.getElementById('telegramLink').value;
            state.paymentSettings.baleLink = document.getElementById('baleLink').value;
            saveData();
            showNotification('تنظیمات پرداخت ذخیره شد', 'success');
        }

        function contactWaitlist(phone) {
            showNotification(`شماره ${phone} کپی شد - آماده تماس`, 'info');
        }

        loadData();
        renderApp();
    </script>
</body>
</html>
